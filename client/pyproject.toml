[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nda-client"
version = "0.1.0"
description = "Laptop client and benchmarks for the Embedded Network Diagnostics Agent"
readme = "README.md"
# Pi OS Bookworm ships 3.11; Trixie ships 3.13. The client also runs natively on Windows.
requires-python = ">=3.11"
dependencies = []  # stdlib only, so it installs anywhere with no network

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
nda = "nda_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs a built nda-server binary (skipped otherwise)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
